name: probe
# probe/** 브랜치에 push하면 공공데이터 API 탐색을 돌리고 결과를 같은 브랜치에 커밋한다.
on:
  push:
    branches: ["probe/**"]
    paths: ["probe/*.py", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run probes
        timeout-minutes: 35
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          JUSO_KEY: ${{ secrets.JUSO_KEY }}
          JUSO_COORD_KEY: ${{ secrets.JUSO_COORD_KEY }}
        run: |
          for f in probe/*.py; do echo "== $f"; python "$f" || true; done
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f probe/out
          git commit -m "probe 결과 $(date -u +%FT%TZ)" || exit 0
          git push
