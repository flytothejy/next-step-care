name: first-run
# 임시: feat/collector 브랜치에서 수집을 돌리고, 요약(데이터 아님)만 브랜치에 커밋한다. 병합 전에 삭제.
on:
  push:
    branches: ["feat/collector"]
    paths: ["nsc/**", ".github/workflows/first-run.yml"]
permissions:
  contents: write
concurrency:
  group: first-run
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      NSC_BUDGET_MIN: "60"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: python -m nsc sync pull
      - run: python -m nsc collect ltc welfare standard
        timeout-minutes: 70
        continue-on-error: true
      - run: python -m nsc build
        continue-on-error: true
      - run: python -m nsc sync push
        continue-on-error: true
      - name: 파일 데이터 내려받기 방식 확인 (포털 스크립트)
        continue-on-error: true
        run: |
          mkdir -p firstrun
          curl -sS -A "Mozilla/5.0" https://www.data.go.kr/js/biz/datset/script_fileDetail.js -o /tmp/fd.js || true
          python - <<'EOF'
          import re, pathlib
          s = pathlib.Path("/tmp/fd.js").read_text(errors="replace") if pathlib.Path("/tmp/fd.js").exists() else ""
          i = s.find("fn_fileDataDown")
          out = s[max(0, i - 200): i + 3500] if i >= 0 else "fn_fileDataDown 없음, 길이 %d" % len(s)
          urls = sorted(set(re.findall(r"['\"](/[a-zA-Z0-9_/]+\.(?:do|json))['\"]", s)))
          pathlib.Path("firstrun/file_download_js.txt").write_text(out + "\n\n== 주소들\n" + "\n".join(urls))
          EOF
      - name: 요약만 커밋
        if: always()
        run: |
          mkdir -p firstrun
          cp data/nsc/runs/*.json firstrun/ 2>/dev/null || true
          cp data/nsc/site/data/hwaseong/meta.json firstrun/ 2>/dev/null || true
          python - <<'EOF'
          import json, collections, pathlib
          p = pathlib.Path("data/nsc/site/data/hwaseong")
          out = {}
          if (p / "institutions.json").exists():
              inst = json.loads((p / "institutions.json").read_text())
              ltc = [x for x in inst if x["source"] == "장기요양기관"]
              out["sample_ltc_full"] = [x for x in ltc if x.get("capacity")][:2]
              out["sample_dementia"] = [x for x in inst if x["source"] == "치매안심센터"][:2]
              out["capacity_waiting_total"] = sum((x.get("capacity") or {}).get("대기") or 0 for x in ltc)
              out["with_waiting"] = sum(1 for x in ltc if ((x.get("capacity") or {}).get("대기") or 0) > 0)
          if (p / "programs.json").exists():
              pr = json.loads((p / "programs.json").read_text())
              out["program_sample"] = [x for x in pr if "발달재활" in (x.get("name") or "")][:1]
              out["programs_linked"] = [(x["name"], x["provider_count"]) for x in pr if x.get("provider_count")][:20]
          pathlib.Path("firstrun/summary.json").write_text(json.dumps(out, ensure_ascii=False, indent=1))
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull -q --rebase origin feat/collector || true
          git add firstrun && git commit -m "first-run 요약" && git push || true
