name: snapshot
# 임시: 목업 작업용으로 R2의 화면 데이터(site/)를 이 브랜치에 커밋한다. main에는 병합하지 않는다.
on:
  push:
    branches: ["snapshot/**"]
    paths: [".github/workflows/snapshot.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: python -m nsc sync pull-site
      - run: |
          mkdir -p snapshot && cp -r data/nsc/site/data/. snapshot/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot && git commit -m "화면 데이터 스냅샷" && git push
